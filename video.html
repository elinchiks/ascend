    <script>
    window.addEventListener("resize", function(){

    if (document.documentElement.clientWidth > 900) {
 
        
            var videoSlider = new Swiper(".videoSwiper", {
      slidesPerView: 3,
      grid: {
        rows: 1,
      },
      spaceBetween: 20,
      pagination: {
        el: ".video-pagination",
        clickable: true,
      },
      navigation: {
        nextEl: ".video-button-next",
        prevEl: ".video-button-prev",
      },
 
    });
    }
    else {
     
        
            var videoSlider = new Swiper(".videoSwiper", {
      slidesPerView: 2,
      grid: {
        rows: 1,
      },
      spaceBetween: 20,
      pagination: {
        el: ".video-pagination",
        clickable: true,
      },
      navigation: {
        nextEl: ".video-button-next",
        prevEl: ".video-button-prev",
      },
 
    });
    }
    }, true);
        
        document.querySelectorAll('.video video').forEach(video => {
  video.addEventListener('canplay', () => {
    video.classList.add('ready');
  });
});
        
 

  </script>
